[package]
name    = "phantom-agent"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio        = { version = "1.35", features = ["full"] }
anyhow       = "1.0"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
uuid         = { version = "1.0", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
tracing      = "0.1"
tracing-subscriber = "0.3"
sysinfo      = "0.30"
reqwest      = { version = "0.11", features = ["json"] }