name: PHANTOM CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-desktop:
    name: Build Electron desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/phantom-admin-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build Electron app
        run: pnpm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PHANTOM-Admin-Setup
          path: apps/phantom-admin-desktop/dist-electron/*.exe

  build-backend:
    name: Lint FastAPI backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/phantom-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: pip install ruff && ruff check .

  deploy-backend:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}